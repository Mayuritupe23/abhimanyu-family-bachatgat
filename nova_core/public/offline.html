<!doctype html>
<html lang="mr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#15803d">
	<title>Abhimanyu Bachat Gat</title>
	<style>
		:root { --g1: #16a34a; --g2: #14532d; --sf: #f59e0b; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
			font-family: Inter, "Segoe UI", "Noto Sans Devanagari", Arial, sans-serif; color: #fff; text-align: center;
			background: radial-gradient(circle at 85% 10%, rgba(245,158,11,.45), transparent 40%), linear-gradient(140deg, var(--g1), var(--g2)); }
		.card { max-width: 360px; }
		img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
		h1 { margin: 22px 0 6px; font-size: 24px; }
		p { margin: 6px 0; opacity: .9; line-height: 1.5; }
		.mr { font-size: 15px; }
		button { margin-top: 22px; border: 0; border-radius: 14px; padding: 12px 26px; font: inherit; font-weight: 800;
			color: #451a03; background: #fbbf24; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
	</style>
</head>
<body>
	<div class="card">
		<img src="/assets/nova_core/images/emblem.svg" alt="">
		<h1>No internet</h1>
		<p>Abhimanyu Bachat Gat needs internet to show the latest money details.</p>
		<p class="mr">इंटरनेट नाही. कनेक्शन आल्यावर पुन्हा प्रयत्न करा.</p>
		<button onclick="location.reload()">Try again</button>
	</div>
	<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
